<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YW商城</title>
   <link rel="stylesheet" href="./css/mi.css">
   <link rel="stylesheet" href="../download/icon2/iconfont.css">
   <script src="./main.js"></script>
</head>
<body>
    <!-- 导航 -->
     <div class="black_nav">
        <div class="wrap">
            <ul class="black_nav_right">
                <!--是可以点击的超链接 -->
                <li><a href="#">用户注册</a><span>|</span></li>
                <li><a href="#">用户登录</a><span>|</span></li>
                <li class="cart">
                    <!-- <a href="#">购物车</a> -->
                     <a href="#" class="cart-trigger">
                        <i class="iconfont icon-shoppingcart"></i>
                        <i>购物车</i>
                     </a>
                    <div class="shoppingcart_list">
                        <div class="sum_price">
                            <span>共减：</span>
                            <span>合计：</span>
                            <a href="../购物车/oder.html" target="_blank">
                                <span>去结算</span>
                            </a>
                        </div>
                    </div>
                </li>
            </ul>

            <ul class="black_nav_left">
                <li><a href="#">YW商城</a><span>|</span></li>
                <li><a href="#">商品分类</a><span>|</span></li>
                <li><a href="#">新品推荐</a><span>|</span></li>
                <li>
                    <a href="#">
                        <i class="iconfont icon-liaotian"></i>
                        <i>消息发送</i>
                    </a>
                    
                    <!-- <a href="#">消息发送</a> -->
                    
                </li>
            </ul>
        </div>
     </div>
     <!-- 导航 -->

    <!-- 下方白色导航栏 -->
     <div class="white_nav">
        <div class="wrap">
            <div class="logo">
                <img src="../image_data/logo.png" alt="">
            </div>
            <div class="nav_bar">
                <ul>
                    <li>
                        <a href="./good/sm_classify.html" class="nav-link" target="_blank">数码</a>
                    </li>
                    <li>
                        <a href="./good/cloth_classify.html" class="nav-link" target="_blank">服饰</a>
                    </li>
                    <li>
                        <a href="./good/food_classify.html" class="nav-link" target="_blank">食品</a>
                    </li>
                    <li><a href="#" class="nav-link">健康</a></li>
                    <li><a href="./good/good_classify.html" class="nav-link">更多</a></li>
                </ul>
            </div>
            <div class="search">
                <!-- 设置搜索框结构 -->
                <a href="../搜索框/research_classify.html" class="search-link" target="_blank">
                    <input type="text" placeholder="笔记本电脑" readonly>
                    <i class="iconfont icon-sousuo"></i>
                </a>
            </div>
        </div>
     </div>

     <!-- 下方白色导航栏 end-->

     <!-- 购物车侧边栏 start -->
     <div class="cart-overlay"></div>
     <div class="cart-sidebar">
        <div class="cart-sidebar-header">
            <span>购物车</span>
            <button class="close-btn">×</button>
        </div>
        <div class="cart-sidebar-content">
            <!-- 商品列表由 JS 动态生成 -->
        </div>
        <div class="cart-sidebar-footer">
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>商品数量</span>
                    <span>0件</span>
                </div>
                <div class="cart-summary-row">
                    <span>运费</span>
                    <span>免运费</span>
                </div>
                <div class="cart-summary-row total">
                    <span>合计</span>
                    <span class="price">¥0</span>
                </div>
            </div>
            <a href="../购物车/oder.html" class="checkout-btn">去结算</a>
        </div>
     </div>
     <!-- 购物车侧边栏 end -->

      <!-- Banner start -->
       <div class="banner">
            <div class="slide">
                <ul>
                    <li><a href="#">新品速递</a></li>
                    <li><a href="#">活动大促</a></li>
                    <li><a href="#">双 11 优惠</a></li>
                </ul>
            </div>
            <div class="wrap carousel-container">
                <!-- 轮播图轨道 -->
                <div class="carousel-track">
                    <a href="./carousel/phone1.html"><img src="../image_data/浅黄色系商品图片生成需求 (24).png" alt="轮播图"></a>
                    <a href="./carousel/phone2.html"><img src="../image_data/浅黄色系商品图片生成需求 (25).png" alt="轮播图"></a>
                    <a href="./carousel/phone3.html"><img src="../image_data/浅黄色系商品图片生成需求 (26).png" alt="轮播图"></a>
                    <a href="./carousel/phone4.html"><img src="../image_data/浅黄色系商品图片生成需求 (27).png" alt="轮播图"></a>
                </div>
                <!-- 底部指示器小圆点 -->
                <div class="indicators">
                    <span class="active" data-index="0"></span>
                    <span data-index="1"></span>
                    <span data-index="2"></span>
                    <span data-index="3"></span>
                </div>
            </div>
        </div>
       <!-- Banner end -->
</body>
</html>
